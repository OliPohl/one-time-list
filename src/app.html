<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the saved theme and default colors before the first paint, so nothing flashes (see app/settings.svelte.js).
			try {
				var saved = JSON.parse(localStorage.getItem('taskbook_settings')) || {};
				var theme = saved.theme;
				if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				document.documentElement.dataset.theme = theme;
				if (typeof saved.colorsCss === 'string') document.documentElement.style.cssText = saved.colorsCss;
			} catch (error) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
